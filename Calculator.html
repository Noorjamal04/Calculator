<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>Calculator task for Neomore by Noor Jamal</h1>
  
  <div class="calculator" id="calculator">
    <input type="text" id="display" disabled>

    <!-- Calculator's digits and mathamatical functions -->
    <div class="buttons">
      <button class="btn" onclick="appendToDisplay('7')">7</button>
      <button class="btn" onclick="appendToDisplay('8')">8</button>
      <button class="btn" onclick="appendToDisplay('9')">9</button>
      <button id="Calfunc" class="btn" onclick="appendToDisplay('/')">/</button>
      
      <button class="btn" onclick="appendToDisplay('4')">4</button>
      <button class="btn" onclick="appendToDisplay('5')">5</button>
      <button class="btn" onclick="appendToDisplay('6')">6</button>
      <button id="Calfunc" class="btn" onclick="appendToDisplay('*')">x</button>
      
      <button class="btn" onclick="appendToDisplay('1')">1</button>
      <button class="btn" onclick="appendToDisplay('2')">2</button>
      <button class="btn" onclick="appendToDisplay('3')">3</button>
      <button id="Calfunc" class="btn" onclick="appendToDisplay('-')">-</button>
      
      <button class="btn" onclick="appendToDisplay('0')">0</button>
      <button id="Calfunc" class="btn" onclick="appendToDisplay('.')">.</button>
      <button id="Calfunc" class="btn" onclick="calculate()">=</button>
      <button id="Calfunc" class="btn" onclick="appendToDisplay('+')">+</button>
    </div>

    <div class="controls">
      <!-- To change the theme of the calculator Dark/Light -->
      <button id="DEL" class="btn control" onclick="clearDisplay()">All Clear</button>
      <button class="btn control" onclick="toggleTheme()">Dark / Light</button>
    </div>
  </div>

  

  <script src="scripts.js"></script>

</body>
</html>
